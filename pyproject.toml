[project]
name = "ai-radar"
dynamic = ["version"]
description = "AI Radar: a local, single-reader FastAPI website"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "tzdata; sys_platform == 'win32'",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
